<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Sitio - Shadow IT Report</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <svg viewBox="0 0 32 32" fill="currentColor">
                    <path d="M15.967 27.994c-.527 0-1.054-.2-1.456-.6l-3.792-3.8a2.066 2.066 0 010-2.92l3.792-3.8a2.052 2.052 0 012.912 0l3.792 3.8c.803.805.803 2.115 0 2.92l-3.792 3.8c-.402.4-.929.6-1.456.6zm0-11.268c-.527 0-1.054-.2-1.456-.6l-3.792-3.8a2.066 2.066 0 010-2.92l3.792-3.8a2.052 2.052 0 012.912 0l3.792 3.8c.803.805.803 2.115 0 2.92l-3.792 3.8c-.402.4-.929.6-1.456.6z"/>
                </svg>
                Shadow IT Report
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="sites.html" class="active">Sitios</a></li>
                <li><a href="apps.html">Apps</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <a href="sites.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Volver a sitios
        </a>

        <!-- Site Header -->
        <div class="card">
            <div class="site-header">
                <div>
                    <h1 id="site-url">-</h1>
                    <p class="site-url">
                        <a id="site-url-link" href="#" target="_blank" class="site-link">Abrir sitio en nueva pestaña</a>
                    </p>
                    <div class="mt-1">
                        <span id="site-status"></span>
                        <span id="site-status-details" class="text-muted" style="margin-left: 0.5rem;"></span>
                    </div>
                </div>
                <div class="site-meta">
                    <div class="meta-item">
                        <span class="meta-value" id="site-users">-</span>
                        <span class="meta-label">Usuarios</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-value" id="site-created">-</span>
                        <span class="meta-label">Creado</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-value" id="site-last-active">-</span>
                        <span class="meta-label">Última Actividad</span>
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <strong>Productos:</strong>
                <div id="site-products" class="products-list mt-1"></div>
            </div>
        </div>

        <!-- Admins Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Administradores</h3>
            </div>
            <div id="admins-list" class="admins-list">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Projects Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Proyectos Jira</h3>
            </div>
            <div id="projects-section">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Spaces Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Espacios Confluence</h3>
            </div>
            <div id="spaces-section">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Apps Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Apps Instaladas</h3>
            </div>
            <div id="apps-section">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
