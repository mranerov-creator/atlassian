<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitios - Shadow IT Report</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <svg viewBox="0 0 32 32" fill="currentColor">
                    <path d="M15.967 27.994c-.527 0-1.054-.2-1.456-.6l-3.792-3.8a2.066 2.066 0 010-2.92l3.792-3.8a2.052 2.052 0 012.912 0l3.792 3.8c.803.805.803 2.115 0 2.92l-3.792 3.8c-.402.4-.929.6-1.456.6zm0-11.268c-.527 0-1.054-.2-1.456-.6l-3.792-3.8a2.066 2.066 0 010-2.92l3.792-3.8a2.052 2.052 0 012.912 0l3.792 3.8c.803.805.803 2.115 0 2.92l-3.792 3.8c-.402.4-.929.6-1.456.6z"/>
                </svg>
                Shadow IT Report
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="sites.html" class="active">Sitios</a></li>
                <li><a href="apps.html">Apps</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Sitios Atlassian</h1>
            <p>Lista completa de sitios shadow IT detectados - <span id="sites-count">0 sitios</span></p>
        </div>

        <!-- Filters -->
        <div class="card">
            <div class="filters">
                <div class="filter-group">
                    <label for="search-input">Buscar:</label>
                    <input type="text" id="search-input" class="filter-input" placeholder="Buscar por URL...">
                </div>
                <div class="filter-group">
                    <label for="status-filter">Estado:</label>
                    <select id="status-filter" class="filter-select">
                        <option value="">Todos</option>
                        <option value="active">Activo</option>
                        <option value="suspended">Suspendido</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="product-filter">Producto:</label>
                    <select id="product-filter" class="filter-select">
                        <option value="">Todos</option>
                        <option value="jira">Jira</option>
                        <option value="confluence">Confluence</option>
                        <option value="jira-servicedesk">Jira Service Desk</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Sites Table -->
        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>URL del Sitio</th>
                            <th>Usuarios</th>
                            <th>Productos</th>
                            <th>Creado</th>
                            <th>Última Actividad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="sites-table-body">
                        <tr>
                            <td colspan="6" class="loading">
                                <div class="spinner"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
