[project]
name = "bluevektor-agents"
version = "0.1.0"
description = "AI-native workforce for BlueVektor - Atlassian Cloud Enterprise Consulting"
authors = [
    {name = "BlueVektor", email = "hello@bluevektor.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # LLM & AI
    "anthropic>=0.40.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",  # For embeddings fallback
    
    # Vector & Memory
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    
    # API & Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    
    # Data & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Tools & Integrations
    "atlassian-python-api>=3.41.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipython>=8.28.0",
]

local-llm = [
    "ollama>=0.3.0",
]

[project.scripts]
bv = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "workflows", "api", "cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
